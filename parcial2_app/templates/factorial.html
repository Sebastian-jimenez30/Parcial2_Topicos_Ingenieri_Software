<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado del Factorial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            text-align: center;
            padding: 50px;
        }
        .result-box {
            background-color: #fff;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="result-box">
        <h1>Factorial de {{ numero }}</h1>
        <p>El resultado es: <strong>{{ resultado }}</strong></p>
    </div>
</body>
</html>
